name: Build APK

on: [push]

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
              distribution: 'temurin'
              java-version: '17'

        - name: Find and Build APK
          run: |
              # gradlew erukra path-ah thedi andha folder-ku pogum
              GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
              DIR=$(dirname "$GRADLEW_PATH")
              echo "Found gradlew in: $DIR"
              cd "$DIR"
              
              chmod +x gradlew
              ./gradlew assembleDebug

        - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
              name: app-debug
              path: '**/build/outputs/apk/debug/app-debug.apk'
